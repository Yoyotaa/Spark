name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: build/bin/spark.app
          - os: windows-latest
            platform: windows/amd64
            artifact: build/bin/spark.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Test
        run: go test ./internal/...

      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: spark-${{ matrix.os }}
          path: ${{ matrix.artifact }}
